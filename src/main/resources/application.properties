spring.application.name=hospital-manager
server.port=8080

# ---------------------------------------------------------------------------
# MySQL (the database is created automatically if it does not exist).
# Override with environment variables DB_URL, DB_USERNAME, DB_PASSWORD.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# JWT
# app.jwt.secret: Base64 string of at least 48 bytes (HS384). This default is
# for local development only - set JWT_SECRET for any real deployment.
# app.jwt.expiration-ms: 3600000 = 1 hour
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:Befa/RHbMrr0U+W0nXCBAflEAJZLPy2tXIs6PSfgksNPMetLtx6MJLpybvxBHHwK}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Create the demo accounts and sample patients on the first start
app.seed.enabled=true
